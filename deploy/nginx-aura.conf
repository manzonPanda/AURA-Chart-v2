# ─────────────────────────────────────────────────────────────────────────────
# AURA-Chart — nginx reverse proxy (Option A: single-origin, NO code changes)
#
# Serves the built frontend (frontend/dist) and proxies the Hono backend on
# the SAME origin, so the browser stays single-origin:
#   - HTTP calls:  frontend/src/services/api.ts  →  "/api"        (relative)
#   - WebSocket:   frontend/src/services/realtime.ts → page origin + "/ws"
#                  (auto-selects wss:// when the page is served over https)
#
# Install (Ubuntu/Debian):
#   sudo cp deploy/nginx-aura.conf /etc/nginx/sites-available/aura.conf
#   sudo ln -sf /etc/nginx/sites-available/aura.conf /etc/nginx/sites-enabled/aura.conf
#   sudo rm -f /etc/nginx/sites-enabled/default     # optional: free port 80
#   sudo nginx -t && sudo systemctl reload nginx
#
# Adjust /opt/aura and server_name to your VM layout / domain or IP.
# ─────────────────────────────────────────────────────────────────────────────

server {
    listen 80;
    listen [::]:80;
    server_name _;                      # your domain, or the VM public IP

    # ── Static frontend (built artifact: frontend/dist — NOT gitignored away) ─
    root /opt/aura/frontend/dist;
    index index.html;

    # The entry document references hashed assets — always revalidate it.
    location = /index.html {
        add_header Cache-Control "no-cache";
    }

    # Vite emits content-hashed filenames — cache them forever.
    location /assets/ {
        add_header Cache-Control "public, max-age=31536000, immutable";
        try_files $uri =404;
    }

    # SPA fallback (single-page app; harmless and future-proof).
    location / {
        try_files $uri $uri/ /index.html;
    }

    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;
    gzip_min_length 1024;

    # ── REST API → Hono backend (no URI part on proxy_pass: path is passed as-is) ─
    location /api/ {
        proxy_pass http://127.0.0.1:8787;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 75s;
    }

    # ── WebSocket relay (/ws) → Hono backend ─────────────────────────────────
    # Required: Upgrade/Connection headers + HTTP/1.1. The backend pushes a
    # status heartbeat every 30 s, so the generous idle timeout below keeps
    # long-lived sockets from being reaped mid-session.
    location = /ws {
        proxy_pass http://127.0.0.1:8787;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
        proxy_buffering off;
    }
}

# ── TLS (enable once you point a DNS A record at the VM) ────────────────────
#   sudo apt install certbot python3-certbot-nginx
#   sudo certbot --nginx -d your.domain.example
# Certbot rewrites this file automatically (80→443 redirect + certs). The
# frontend needs NO changes: realtime.ts upgrades to wss:// by itself as soon
# as the page is served over https.
